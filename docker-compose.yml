services:
  robot_mock:
    build:
      context: ./robot_mock
    container_name: spot_robot_mock
    ports:
      - "44444:44444"

  api_mock:
    build:
      context: ./api_mock
    container_name: spot_api_mock
    ports:
      - "3001:3001"
    environment:
      ROBOT_MOCK_HOST: robot_mock
      ROBOT_MOCK_PORT: "44444"
      PORT: "3001"
    volumes:
      # robot_mock is the Python package itself (flat layout) → mount it as /app/robot_mock
      - ./robot_mock:/app/robot_mock:ro
    depends_on:
      - robot_mock

  web_mock:
    build:
      context: ./web_mock
      args:
        VITE_API_BASE: http://localhost:3001
    container_name: spot_web_mock
    ports:
      - "4000:4000"
    environment:
      VITE_API_BASE: http://localhost:3001
    depends_on:
      - api_mock
