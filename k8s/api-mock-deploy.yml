apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-mock
  labels: { app: api-mock }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-mock } }
  template:
    metadata: { labels: { app: api-mock } }
    spec:
      containers:
        - name: api-mock
          image: spot-sdk-mock/api-mock:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 3001, name: http }
          env:
            - { name: ROBOT_MOCK_HOST, value: robot-mock }
            - { name: ROBOT_MOCK_PORT, value: "44444" }
            - { name: PORT, value: "3001" }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-mock
spec:
  selector: { app: api-mock }
  ports:
    - { name: http, port: 3001, targetPort: http }
