apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-mock
  labels: { app: robot-mock }
spec:
  replicas: 1
  selector: { matchLabels: { app: robot-mock } }
  template:
    metadata: { labels: { app: robot-mock } }
    spec:
      containers:
        - name: robot-mock
          image: spot-sdk-mock/robot-mock:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 44444, name: grpc }
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: robot-mock
spec:
  selector: { app: robot-mock }
  ports:
    - { name: grpc, port: 44444, targetPort: grpc }
