[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot_mock"
version = "0.1.0"
description = "Pure-Python gRPC mock of Boston Dynamics Spot for SDK tests and demos."
requires-python = ">=3.10"
dependencies = [
  "bosdyn-client==5.1.4",
  "bosdyn-core==5.1.4",
  "bosdyn-mission==5.1.4",
  "grpcio==1.80.0",
]

[project.optional-dependencies]
test = ["pytest>=9", "python-pptx"]

[tool.setuptools]
# Flat layout: the project root *is* the `robot_mock` Python package. The
# upstream Spot SDK tests live under ``vendor/spot-sdk`` (a git submodule);
# the only Python code shipped from this directory is the mock server +
# its own service-level tests.
packages = [
  "robot_mock",
  "robot_mock.servicers",
  "robot_mock.tests",
]
package-dir = { robot_mock = "." }
