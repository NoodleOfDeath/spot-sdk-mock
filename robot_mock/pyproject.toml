[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot_mock"
version = "0.1.0"
description = "Pure-Python gRPC mock of Boston Dynamics Spot for SDK tests and demos."
requires-python = ">=3.10"
dependencies = [
  "bosdyn-client==5.1.4",
  "bosdyn-core==5.1.4",
  "bosdyn-mission==5.1.4",
  "grpcio==1.80.0",
]

[project.optional-dependencies]
test = ["pytest>=9", "python-pptx"]

[tool.setuptools]
# Sources for the `robot_mock` package live at the project root rather than in
# a nested `robot_mock/` directory. This keeps the layout flat — one folder,
# one Python package.
packages = [
  "robot_mock",
  "robot_mock.servicers",
  "robot_mock.tests",
  "robot_mock.tests.sdk",
  "robot_mock.tests.sdk.mission",
]
package-dir = { robot_mock = "." }

[tool.pytest.ini_options]
testpaths = ["robot_mock/tests"]
